# Construit TalkTome pour Android et publie le fichier à installer (APK).
#
# - À chaque changement sur master : l'APK est publié dans la version
#   « latest » du dépôt (lien fixe, toujours la dernière version).
# - Signature : la clé de débogage du PC de Hugo (secret
#   ANDROID_DEBUG_KEYSTORE_BASE64 = debug.keystore encodé en base64), pour que
#   l'APK téléchargé mette à jour l'app déjà installée sans perdre ses données.
# - Sur une autre branche : construit seulement (artefact), pour vérifier que
#   tout compile ; sans le secret, une clé jetable est utilisée.
name: Android APK

on:
  push:
    branches: [master, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey > /dev/null
            echo "Clé du PC utilisée."
          elif [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 absent : l'APK ne pourrait pas mettre à jour l'app installée. Voir le README."
            exit 1
          else
            echo "::warning::Pas de clé du PC : clé jetable (test de compilation seulement)."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Construire l'APK
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-arm64
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-debug.apk ../dist/TalkTome.apk

      - name: Garder l'APK (branches de test)
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: TalkTome-apk
          path: dist/TalkTome.apk
          retention-days: 7

      - name: Publier dans la version « latest »
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Dernière version de TalkTome (master, ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')). Installer TalkTome.apk sur le téléphone : il met à jour l'app existante, données conservées."
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest dist/TalkTome.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest dist/TalkTome.apk --title "TalkTome — dernière version" --notes "$notes"
          fi
