name: talktome
description: "AI-powered ebook reader with text-to-speech"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI & State Management
  cupertino_icons: ^1.0.2
  provider: ^6.0.0

  # File handling
  file_picker: ^8.0.0
  path_provider: ^2.1.0

  # Audio playback
  just_audio: ^0.9.34
  audio_session: ^0.1.16
  audio_service: ^0.18.13

  # TTS local (voix hors-ligne, moteur natif du téléphone — pas de réseau,
  # pas de quota, fonctionne en 4G loin de la maison)

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP client for backend API
  dio: ^5.3.1

  # PDF extraction (pdfx: couverture uniquement — pas de texte ; pdfrx: le texte)
  pdf: ^3.10.0
  pdfx: ^2.7.2+1
  pdfrx: ^1.1.0

  # EPUB extraction
  epub_decoder: ^0.1.4
  archive: ^3.4.0
  xml: ^6.0.0

  # Logging & debugging
  logger: ^2.0.0

  # Permissions runtime (Android 13+ notifications)
  permission_handler: ^11.0.0

  # Défilement précis vers un index arbitraire dans une liste à hauteur
  # variable (remplace notre estimation "à la main" pour les grands sauts —
  # curseur de progression, retour à la lecture — jamais fiable sur de
  # longues distances)
  scrollable_positioned_list: ^0.3.8

  # Scan caméra + OCR on-device
  camera: ^0.11.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.3.0  # 4.4+ exige archive ^4.x, incompatible avec epub_decoder/file_service

  # Import d'articles web (parsing HTML pour extraire le texte principal)
  html: ^0.15.4

  # Voix IA locales gratuites (synthèse neuronale sur le téléphone, hors ligne,
  # aucune clé API) — modèles Piper/Kokoro via sherpa-onnx
  # Reste en 1.x : la 2.0 a retiré la phonémisation espeak-ng intégrée dont
  # les voix Piper (français) ont besoin.
  sherpa_onnx: ^1.13.8
  google_mlkit_translation: ^0.13.1
  llama_flutter_android:
    path: packages/llama_flutter_android
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

# path_provider_foundation >=2.5.0 pulls in package:objective_c, whose native-assets
# build hook breaks on Windows project paths containing spaces (even for Android builds).
# Pinning to the last pre-ffigen release avoids that hook entirely.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/avatars/
    - assets/branding/tomy.png
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
